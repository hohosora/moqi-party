name: P3 automated game matrix
on:
  pull_request:
    paths:
      - 'app.js'
      - 'firestore.rules'
      - 'tests/p3-auto/**'
      - '.github/workflows/p3-auto.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  emulator-games:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --no-audit --no-fund
      - run: node --test tests/p3-auto/diagnostics.cjs
      - run: npx --no-install firebase emulators:exec --project demo-moqi-party-p1 --only firestore "node tests/p3-auto/game-matrix.cjs"
  browser-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install browser tools outside repository
        run: |
          npm install --prefix "$RUNNER_TEMP/moqi-auto" --no-save --no-package-lock --no-audit --no-fund playwright
          "$RUNNER_TEMP/moqi-auto/node_modules/.bin/playwright" install --with-deps chromium firefox webkit
      - name: Browser and theme scenarios
        env:
          NODE_PATH: ${{ runner.temp }}/moqi-auto/node_modules
        run: node tests/p3-auto/browser-matrix.cjs
