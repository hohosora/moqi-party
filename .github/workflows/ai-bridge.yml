name: AI bridge safety tests
on:
  pull_request:
    paths:
      - 'admin/ai-bridge/**'
      - '.github/workflows/ai-bridge.yml'
      - 'docs/AI-BRIDGE.md'
      - 'AGENTS.md'
  push:
    branches: [main]
    paths:
      - 'admin/ai-bridge/**'
      - '.github/workflows/ai-bridge.yml'
      - 'docs/AI-BRIDGE.md'
      - 'AGENTS.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bridge-unit:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: node --check admin/ai-bridge/bridge.cjs
      - run: node --test admin/ai-bridge/bridge.test.cjs
