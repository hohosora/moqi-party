name: UI and scoring regression
on:
  push:
    branches: [main]
    paths:
      - 'styles.css'
      - 'retro-mechanical.css'
      - 'ui-clarity.css'
      - 'app.js'
      - 'index.html'
      - 'tests/theme-contrast.cjs'
      - 'tests/surface-text-contrast.cjs'
      - 'tests/browser-contrast.cjs'
      - 'tests/emoji-compat.cjs'
      - 'emoji-compat.js'
      - 'tests/scoring-rules.cjs'
      - 'tests/quick-host.cjs'
      - 'tests/client-security.cjs'
      - 'tests/host-vote-sync.cjs'
      - 'tests/room-retention.cjs'
      - 'admin/room-retention.cjs'
      - 'app-check-config.js'
      - '.github/workflows/ui-contrast.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check-contrast:
    name: Verify themes and scoring logic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check text and surface contrast
        run: node tests/theme-contrast.cjs
      - name: Check pixel and minimal screen typography across every hue
        run: node tests/surface-text-contrast.cjs
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser audit tooling
        run: |
          mkdir -p "$RUNNER_TEMP/moqi-contrast"
          npm install --prefix "$RUNNER_TEMP/moqi-contrast" --no-save --no-package-lock --no-audit --no-fund playwright @axe-core/playwright
          "$RUNNER_TEMP/moqi-contrast/node_modules/.bin/playwright" install --with-deps chromium
      - name: Audit real mobile UI in Chromium (all host/player phases)
        env:
          NODE_PATH: ${{ runner.temp }}/moqi-contrast/node_modules
        run: node tests/browser-contrast.cjs
      - name: Validate Unicode emoji fallbacks on desktop and mobile screens
        env:
          NODE_PATH: ${{ runner.temp }}/moqi-contrast/node_modules
        run: node tests/emoji-compat.cjs
      - name: Reject injected Firestore values and insecure room codes
        run: node tests/client-security.cjs
      - name: Verify host vote synchronization fallback
        run: node --test tests/host-vote-sync.cjs
      - name: Verify room retention policy
        run: node --test tests/room-retention.cjs
      - name: Check hot and cold prediction scoring
        run: node tests/scoring-rules.cjs
      - name: Check 100 curated questions and quick-host flow
        run: node tests/quick-host.cjs
