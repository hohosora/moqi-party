name: Firestore rules security regression
on:
  push:
    branches: [main]
    paths:
      - 'firestore.rules'
      - 'firebase.json'
      - 'package.json'
      - 'tests/firestore-rules-emulator.cjs'
      - '.github/workflows/firestore-rules.yml'
  pull_request:
    paths:
      - 'firestore.rules'
      - 'firebase.json'
      - 'package.json'
      - 'tests/firestore-rules-emulator.cjs'
      - '.github/workflows/firestore-rules.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  emulator-security:
    name: Validate Firestore rules with emulator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install test-only Firebase dependencies
        run: npm install --no-save --no-package-lock --no-audit --no-fund
      - name: Verify room, player, vote and phase permissions
        run: npm run test:rules
