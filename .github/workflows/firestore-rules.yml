name: Firestore rules security regression
on:
  push:
    branches: [main]
    paths:
      - 'firestore.rules'
      - 'firebase.json'
      - 'package.json'
      - 'package-lock.json'
      - 'app.js'
      - 'app-check-config.js'
      - 'tests/client-security.cjs'
      - 'tests/firestore-rules-emulator.cjs'
      - '.github/workflows/firestore-rules.yml'
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  emulator-security:
    name: Validate Firestore rules with emulator
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Install test-only Firebase dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify room, player, vote and phase permissions
        run: npm run test:rules
