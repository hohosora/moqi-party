name: P3 isolated admission and dependency audit
on:
  pull_request:
    paths:
      - 'tests/p3-lab/**'
      - '.github/workflows/p3-lab.yml'
      - 'package.json'
      - 'package-lock.json'
  push:
    branches: [main]
    paths:
      - 'tests/p3-lab/**'
      - '.github/workflows/p3-lab.yml'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:
  workflow_call:
    inputs:
      audit_only:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  admission-lab:
    if: inputs.audit_only != true
    name: Isolated admission emulator
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --no-audit --no-fund
      - name: Isolated 20-seat protocol checks
        run: npx --no-install firebase emulators:exec --project demo-moqi-party-p1 --only firestore "node tests/p3-lab/admission-emulator.cjs"
  dependency-audit:
    name: Read-only npm dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node tests/p3-lab/audit-report.cjs
